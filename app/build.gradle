plugins {
    id 'com.android.application' version '8.13.2'
    id 'org.jetbrains.kotlin.android' version '2.1.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.21'
}

tasks.named('preBuild').configure {
    doFirst {
        def models = ['bulbasaur', 'charmander', 'squirtle', 'pikachu', 'eevee']
        def missing = models.findAll { !file("src/main/assets/web/models/${it}.glb").isFile() }
        if (missing) {
            throw new GradleException("Missing GLB files: ${missing.join(', ')}. Run fetch-models.ps1 from the repository root.")
        }
    }
}

android {
    namespace 'com.familygarden.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.familygarden.app'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.compose.foundation:foundation:1.6.8'
}
