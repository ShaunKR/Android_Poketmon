<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob:; frame-src 'none'; object-src 'none'">
<title>포켓몬 정원</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<section id="splash" class="screen splash" aria-labelledby="splashTitle">
  <div class="portraits">
    <figure><div class="portrait" id="face-hyeonjin" aria-hidden="true">현진</div><figcaption>현진</figcaption></figure>
    <figure><div class="portrait" id="face-hyeonseo" aria-hidden="true">현서</div><figcaption>현서</figcaption></figure>
  </div>
  <h1 id="splashTitle">포켓몬 정원</h1>
  <p id="splashStatus" role="status">정원을 준비하고 있어요…</p>
</section>
<header id="header" hidden>
  <div><span class="eyebrow">우리 집 색칠 놀이터</span><h1>포켓몬 정원</h1></div>
  <div class="actions"><button id="back" hidden>뒤로</button><button id="settings">설정하기</button></div>
</header>
<section id="home" class="screen" hidden>
  <h2>오늘은 어떤 포켓몬을 색칠할까?</h2>
  <p id="activeProfile"></p>
  <div class="actions">
    <button id="choose" class="primary">색칠하기</button>
    <button id="garden">내 정원</button>
  </div>
  <p id="homeStatus" role="status"></p>
</section>
<section id="picker" class="screen" hidden>
  <h2>포켓몬을 골라요</h2>
  <div id="characters" class="characters"></div>
  <p id="pickerStatus" role="status"></p>
</section>
<section id="serverSettings" class="screen" hidden>
  <h2>설정하기</h2>
  <form id="preferences">
    <h3>서버 설정</h3>
    <label>누가 색칠하나요? <select id="profile"><option value="아이 1">현진</option><option value="아이 2">현서</option></select></label>
    <label>서버 주소 <input id="serverUrl" type="url" placeholder="http://192.168.0.10:8787"></label>
    <label>전송 키 <input id="serverKey" type="password" autocomplete="off"></label>
    <label>NAS 캐릭터 폴더 주소 <input id="characterUrl" type="url" placeholder="http://192.168.0.10/characters/"></label>
    <button class="primary" type="submit">설정 저장</button>
  </form>
  <section id="characterSettings" aria-labelledby="characterSettingsTitle">
    <h3 id="characterSettingsTitle">캐릭터 설정</h3>
    <button id="syncCharacters" class="primary" hidden>동기화</button>
    <p>캐릭터를 두 번 누르면 지원하는 모션을 볼 수 있어요.</p>
    <div id="characterCatalog" class="characters"></div>
    <button id="showMotions" disabled>모션 보기</button>
    <p id="syncStatus" role="status"></p>
  </section>
</section>
<dialog id="motions">
  <h2 id="motionsTitle"></h2>
  <ul id="motionNames"></ul>
  <form method="dialog"><button>닫기</button></form>
</dialog>
<main id="workspace" hidden>
  <section id="stage" aria-label="포켓몬 화면"></section>
  <aside>
    <section id="editor">
      <h2 id="drawingTitle">색칠하기</h2>
      <div id="palette" aria-label="물감"></div>
      <label>붓 크기 <input id="brush" type="range" min="3" max="35" value="14"></label>
      <div class="tabs"><button id="undo">되돌리기</button><button id="clear">처음부터</button></div>
      <button class="primary" id="send" hidden>전송하기</button>
      <button id="finish">내 정원에 저장</button>
    </section>
    <section id="gardenInfo" hidden>
      <h2>함께 만든 정원</h2>
      <p>최근 완성한 포켓몬 여섯 마리가 함께 지내요. 포켓몬을 톡 누르면 기뻐해요.</p>
      <ul id="residents"></ul>
    </section>
    <p id="status" role="status">정원을 준비하고 있어요.</p>
  </aside>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
